<main class="w-full pb-16">
  <div class="max-w-3xl mx-auto mt-10 p-6 md:p-8 bg-[#1D283D] border border-slate-700 rounded-xl shadow-2xl w-full">
    
    <h1 class="text-2xl md:text-3xl font-bold text-slate-100 mb-8 border-b border-slate-700 pb-4">
      {{ isEditMode ? 'Modifier l\'hôtel' : 'Ajouter un nouvel hôtel' }}
    </h1>

    @if (errorMessage) {
      <div class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-6 text-sm font-medium flex items-center gap-2 shadow-inner" role="alert">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="hotelForm" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-6">
      
      <div class="flex flex-col">
        <label for="name" class="text-sm font-medium text-slate-300 mb-2">
          Nom de l'hôtel <span class="text-red-400" aria-hidden="true">*</span>
        </label>
        <input type="text" id="name" formControlName="name" required
               class="w-full px-4 py-2.5 bg-[#18191C] border border-slate-600 rounded-lg focus:ring-2 focus:ring-[#005ab9] focus:outline-none text-white transition-colors shadow-inner">
      </div>

      <div class="flex flex-col">
        <label for="address" class="text-sm font-medium text-slate-300 mb-2">
          Adresse <span class="text-red-400" aria-hidden="true">*</span>
        </label>
        <input type="text" id="address" formControlName="address" required
               class="w-full px-4 py-2.5 bg-[#18191C] border border-slate-600 rounded-lg focus:ring-2 focus:ring-[#005ab9] focus:outline-none text-white transition-colors shadow-inner">
      </div>

      <div class="flex flex-col md:flex-row gap-6">
        <div class="flex flex-col flex-1">
          <label for="city" class="text-sm font-medium text-slate-300 mb-2">
            Ville <span class="text-red-400" aria-hidden="true">*</span>
          </label>
          <input type="text" id="city" formControlName="city" required
                 class="w-full px-4 py-2.5 bg-[#18191C] border border-slate-600 rounded-lg focus:ring-2 focus:ring-[#005ab9] focus:outline-none text-white transition-colors shadow-inner">
        </div>
        <div class="flex flex-col flex-1">
          <label for="country" class="text-sm font-medium text-slate-300 mb-2">
            Pays <span class="text-red-400" aria-hidden="true">*</span>
          </label>
          <input type="text" id="country" formControlName="country" required
                 class="w-full px-4 py-2.5 bg-[#18191C] border border-slate-600 rounded-lg focus:ring-2 focus:ring-[#005ab9] focus:outline-none text-white transition-colors shadow-inner">
        </div>
      </div>

      <div class="flex flex-col">
        <label for="description" class="text-sm font-medium text-slate-300 mb-2">
          Description <span class="text-red-400" aria-hidden="true">*</span>
        </label>
        <textarea id="description" formControlName="description" rows="5" required
                  class="w-full px-4 py-2.5 bg-[#18191C] border border-slate-600 rounded-lg focus:ring-2 focus:ring-[#005ab9] focus:outline-none text-white transition-colors resize-y shadow-inner"></textarea>
      </div>

      <fieldset class="border border-slate-600 p-5 rounded-lg bg-[#18191C]/30 mt-2">
        <legend class="text-sm font-bold text-slate-300 px-3 bg-[#1D283D] rounded-full border border-slate-600 uppercase tracking-wider py-1">Équipements</legend>
        
        <div class="flex flex-wrap gap-x-8 gap-y-4 mt-3">
          <label class="flex items-center gap-2.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
            <input type="checkbox" formControlName="wifi" class="w-4 h-4 accent-[#005ab9] bg-slate-800 border-slate-600 rounded cursor-pointer"> 
            Wifi Gratuit
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
            <input type="checkbox" formControlName="piscine" class="w-4 h-4 accent-[#005ab9] bg-slate-800 border-slate-600 rounded cursor-pointer"> 
            Piscine
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
            <input type="checkbox" formControlName="spa" class="w-4 h-4 accent-[#005ab9] bg-slate-800 border-slate-600 rounded cursor-pointer"> 
            Spa
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
            <input type="checkbox" formControlName="parking" class="w-4 h-4 accent-[#005ab9] bg-slate-800 border-slate-600 rounded cursor-pointer"> 
            Parking
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer text-slate-300 text-sm font-medium hover:text-white transition-colors">
            <input type="checkbox" formControlName="animaux" class="w-4 h-4 accent-[#005ab9] bg-slate-800 border-slate-600 rounded cursor-pointer"> 
            Animaux acceptés
          </label>
        </div>
      </fieldset>

      @if (!isEditMode) {
        <div class="flex flex-col mt-2 p-5 border border-slate-700 rounded-lg bg-[#18191C]/10">
          <label for="imageUrl" class="text-sm font-medium text-slate-300 mb-2">
            Image de couverture <span class="text-slate-500 font-normal ml-1">(Optionnel)</span>
          </label>
          <input type="text" id="imageUrl" formControlName="imageUrl" placeholder="assets/img_hotels/nom-image.jpg"
                 class="w-full px-4 py-2.5 bg-[#18191C] border border-slate-600 rounded-lg focus:ring-2 focus:ring-[#005ab9] focus:outline-none text-white transition-colors placeholder-slate-600 shadow-inner">
          <p class="text-xs text-slate-400 mt-3 flex items-start gap-1.5 leading-relaxed">
            <svg class="w-4 h-4 shrink-0 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Astuce : Placez l'image dans le dossier <strong class="text-slate-300">src/assets/</strong> de votre projet Angular et indiquez son chemin exact.
          </p>
        </div>
      }

      <div class="flex flex-col-reverse md:flex-row justify-end md:justify-between items-center gap-4 mt-4 pt-6 border-t border-slate-700">
        <a routerLink="/admin" class="w-full md:w-auto text-center text-slate-400 hover:text-slate-200 font-bold transition-colors py-2">
          Annuler
        </a>
        
        <button type="submit" [disabled]="hotelForm.invalid" 
                class="w-full md:w-auto px-8 py-3 bg-[#005ab9] hover:bg-[#007bff] text-white font-bold rounded-lg transition-all duration-200 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isEditMode ? 'Enregistrer les modifications' : 'Créer l\'hôtel' }}
        </button>
      </div>
      
    </form>
  </div>
</main>
